name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleClassicDebug assembleWideDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BlackBarMask-4x3-apk
          path: app/build/outputs/apk/classic/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BlackBarMask-16x9-apk
          path: app/build/outputs/apk/wide/debug/*.apk

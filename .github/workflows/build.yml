name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write   # 发布固定下载链接的 Release 需要
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log || {
            grep -E "error:|AAPT|What went wrong|Execution failed|Caused by" -A3 build.log | head -60 \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Liubai-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: 发布最新版（固定下载链接）
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Liubai.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Liubai.apk --latest \
            --title "留白 最新版" \
            --notes "自动构建，对应提交 ${{ github.sha }}"
